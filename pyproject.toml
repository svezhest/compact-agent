[project]
name = "compact-agent"
version = "0.2.0"
description = "Sieve a stored conversation through an LLM into pre-declared topic buckets — a resumable, structured markdown report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=0.0.14",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
compact-agent = "compact_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compact_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
