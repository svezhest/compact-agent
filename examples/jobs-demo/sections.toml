# Run spec for the job-channel demo. Order = order in the report.
#   shortlist   -> the offers that fit profile.md (the candidate)          [in the report]
#   market      -> per-direction digest: offers, grades, ranges, employers  [in the report]
#   companies   -> per-employer: what they do, ranges seen, projects       [in the report]
#   job_offers  -> one typed card per vacancy: the ground truth the three above query;
#                  the model sees the cards, the report does NOT include them (in_report=False)
# Usage (from the repo root):
#   cp examples/jobs-demo/sections.toml examples/jobs-demo/profile.md data/<slug>/
#   COMPACT_PROFILE=data/<slug>/profile.md uv run compact-agent compact <slug> -p examples/sections

plugin_dirs = ["../../examples/sections"]

[sections.shortlist]
[sections.market]
[sections.companies]
[sections.job_offers]
